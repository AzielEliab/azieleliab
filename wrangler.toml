# azieleliab.com landing Worker.
# Author: Aziel Eliab. Identity is Aziel Eliab only. Apache-2.0.
name = "azieleliab-com"
main = "src/index.js"
compatibility_date = "2026-09-05"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

# Pageview counter. Production namespace already in use.
[[kv_namespaces]]
binding = "VIEWS"
id = "61eedc98e4244a2b85f1cdd8b52beee1"

# Same-account FragGate door. HTTPS origin is the fallback.
[[services]]
binding = "AZIEL_RUNTIME"
service = "aziel-runtime"

[[routes]]
pattern = "azieleliab.com"
custom_domain = true

[[routes]]
pattern = "www.azieleliab.com"
custom_domain = true
