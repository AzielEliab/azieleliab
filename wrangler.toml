# azieleliab.com landing Worker.
# Author: Aziel Eliab. Identity is Aziel Eliab only. Apache-2.0.
name = "azieleliab-com"
main = "src/index.js"
compatibility_date = "2026-09-05"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
account_id = "ac575a9b822bea2bed97d0ab73aed238"

[observability]
enabled = true
head_sampling_rate = 1

# Pageview counter. Also stores host-local /runtime API uses under
# key prefix `runtime_uses|` (no separate RUNTIME_USES namespace).
[[kv_namespaces]]
binding = "VIEWS"
id = "61eedc98e4244a2b85f1cdd8b52beee1"

# Same-account FragGate door. HTTPS origin is the fallback.
[[services]]
binding = "AZIEL_RUNTIME"
service = "aziel-runtime"

[[routes]]
pattern = "azieleliab.com"
custom_domain = true

[[routes]]
pattern = "www.azieleliab.com"
custom_domain = true
