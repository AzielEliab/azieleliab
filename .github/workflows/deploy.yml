# Push to main always runs Test.
# Live deploys are GitBaby / Cursor wrangler OAuth (Aziel Eliab) — that is
# the primary path. This Actions workflow is an optional backup only.
# Deploy runs only when secrets.CLOUDFLARE_API_TOKEN != ''.
# A missing token skips deploy and must not fail (stops failure emails).
# Do not invent or commit tokens. Account id is not a secret.
# Author: Aziel Eliab.
name: Deploy

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  deploy:
    needs: test
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ac575a9b822bea2bed97d0ab73aed238
